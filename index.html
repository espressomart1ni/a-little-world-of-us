<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Little World of Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "phaser": "https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.esm.js"
      }
    }
  </script>
</head>
<body>
  <div id="game"></div>

  <div id="title-screen">
    <div class="title-inner">
      <div class="hearts">&#9829; &nbsp; &#9829; &nbsp; &#9829;</div>
      <h1>A Little World<br />of Us</h1>
      <p class="names">Yash &amp; Arkisha</p>
      <p class="start">Press ENTER to begin</p>
    </div>
  </div>

  <div id="controls" class="pixel-box hide">
    <div><b>WASD</b> / <b>ARROWS</b> &nbsp;Walk</div>
    <div><b>E</b> / <b>CLICK</b> &nbsp;Look / Talk</div>
    <div><b>M</b> &nbsp;Mute</div>
  </div>

  <div id="audio-panel" class="pixel-box hide">
    <button id="btn-mute" class="px-btn" type="button">MUTE</button>
    <label>MUSIC <input id="vol-music" type="range" min="0" max="100" value="60" /></label>
    <label>SFX <input id="vol-sfx" type="range" min="0" max="100" value="80" /></label>
  </div>

  <div id="dialogue" class="pixel-box hide">
    <div class="dlg-name"></div>
    <div class="dlg-text"></div>
    <div class="dlg-arrow">&#9660;</div>
  </div>

  <div id="choices" class="pixel-box hide"></div>
  <div id="caption" class="hide"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
